            db.collection("registrations").onSnapshot((snapshot) => {
                state.registrations = [];
                snapshot.forEach((doc) => state.registrations.push(doc.data()));
                if (state.view !== 'daftar') render(); // Cegah gangguan saat user sedang mengisi form

            db.collection("news").onSnapshot((snapshot) => {

                snapshot.forEach((doc) => state.news.push(doc.data()));
                if (state.view !== 'daftar') render();
            });

        function toast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `p-4 rounded-xl shadow-xl text-white font-medium text-sm animate-fade-in ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} pointer-events-auto`;
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function saveLocalData() {
            if (!useFirebase) {
                localStorage.setItem('registrations', JSON.stringify(state.registrations));
                localStorage.setItem('news', JSON.stringify(state.news));
            }
            localStorage.setItem('user', JSON.stringify(state.user));
        }

        function render() {
            const container = document.getElementById('content');

                case 'berita': container.innerHTML = viewBerita(); break;
                case 'profil': container.innerHTML = viewProfil(); break;
                case 'akademik': container.innerHTML = viewAkademik(); break;
                case 'alur': container.innerHTML = viewAlur(); break;
                case 'daftar': container.innerHTML = viewDaftar(); break;
                case 'login': container.innerHTML = viewLogin(); break;
                case 'admin': container.innerHTML = viewAdmin(); break;
                default: container.innerHTML = viewHome();

        function updateMajorsDropdown(schoolName, selectedMajor = "") {
            const dropdown = document.getElementById('major-select');
            const school = SCHOOLS.find(s => s.name === schoolName);
            if (!school) { dropdown.innerHTML = '<option value="">-- Pilih Jurusan --</option>'; return; }

        async function handleDaftar(e) {
            e.preventDefault();
            
            const formElement = e.target;
            const form = new FormData(formElement);
            const data = Object.fromEntries(form.entries());
            
            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "MENYIMPAN DATA...";
            submitBtn.disabled = true;

            try {
                if (state.editData) {
                    // Update Mode
                    if (useFirebase) {
                        await db.collection("registrations").doc(state.editData.id.toString()).update(data);
                    } else {
                        const idx = state.registrations.findIndex(r => r.id === state.editData.id);
                        state.registrations[idx] = { ...state.registrations[idx], ...data };
                    }
                    state.editData = null;
                    toast("Data berhasil diperbarui!", "success");
                    saveLocalData();
                    nav('admin');
                } else {
                    // Pendaftaran Baru
                    const newId = Date.now().toString();
                    data.id = newId;
                    data.status = 'Menunggu'; 
                    
                    if (useFirebase) {
                        await db.collection("registrations").doc(newId).set(data);
                    } else {
                        state.registrations.push(data);
                    }

                    toast("Pendaftaran berhasil disimpan!", "success");
                    saveLocalData();
                    state.selectedSchool = null; 
                    nav('home');
                }
            } catch (error) {
                toast("Terjadi kesalahan sistem saat menyimpan data.", "error");
                console.error(error);
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }

        async function updateStatus(id, status) { 
            try {
                if (useFirebase) {
                    await db.collection("registrations").doc(id.toString()).update({ status: status });
                } else {
                    const idx = state.registrations.findIndex(r => r.id === id);
                    state.registrations[idx].status = status;
                    saveLocalData();
                    render();
                }
                toast(`Status diperbarui ke ${status}`);
            } catch (error) {
                toast("Gagal mengubah status.", "error");
            }
        }
        
        async function deletePendaftar(id) { 
            if (!confirm("Hapus data secara permanen?")) return; 
            try {
                if (useFirebase) {
                    await db.collection("registrations").doc(id.toString()).delete();
                } else {
                    state.registrations = state.registrations.filter(r => r.id !== id);
                    saveLocalData();
                    render();
                }
                toast("Data berhasil dihapus.");
            } catch (error) {
                toast("Gagal menghapus data.", "error");
            }
        }

        function triggerEdit(id) { state.editData = state.registrations.find(r => r.id === id); nav('daftar'); }
        function cancelEdit() { state.editData = null; nav('admin'); }
        function setAdminTab(tab) { state.adminTab = tab; state.editNewsData = null; render(); }

        async function handleNewsSubmit(e) {
            e.preventDefault();
            const form = new FormData(e.target);
            const data = Object.fromEntries(form.entries());
            
            try {
                if (state.editNewsData) {
                    const idx = state.news.findIndex(n => n.id === state.editNewsData.id);
                    if (state.user.role !== 'master' && state.news[idx].authorId !== state.user.id) {
                        toast("Anda tidak memiliki izin mengedit berita ini.", "error");
                        return;
                    }

                    if (useFirebase) {
                        await db.collection("news").doc(state.editNewsData.id.toString()).update({ title: data.title, content: data.content });
                    } else {
                        state.news[idx] = { ...state.news[idx], title: data.title, content: data.content };
                        saveLocalData();
                        render();
                    }
                    
                    state.editNewsData = null;
                    toast("Berita berhasil diperbarui.");
                } else {
                    const newId = Date.now().toString();
                    const newsData = {
                        id: newId,
                        title: data.title,
                        content: data.content,
                        author: state.user.name,
                        authorId: state.user.id,
                        date: new Date().toISOString().split('T')[0]
                    };
                    
                    if (useFirebase) {
                        await db.collection("news").doc(newId).set(newsData);
                    } else {
                        state.news.push(newsData);
                        saveLocalData();
                        render();
                    }
                    
                    toast("Berita baru berhasil diposting!");
                }
            } catch (error) {
                toast("Gagal menyimpan berita.", "error");
            }
        }

        function editNews(id) {
            state.editNewsData = state.news.find(n => n.id === id);
            render();
        }

        async function deleteNews(id) {
            const newsToDelete = state.news.find(n => n.id === id);
            if (state.user.role !== 'master' && newsToDelete.authorId !== state.user.id) {
                toast("Izin ditolak.", "error");
                return;
            }
            if (!confirm("Hapus berita ini dari database?")) return;
            try {
                if (useFirebase) {
                    await db.collection("news").doc(id.toString()).delete();
                } else {
                    state.news = state.news.filter(n => n.id !== id);
                    saveLocalData();
                    render();
                }
                toast("Berita berhasil dihapus.");
            } catch (error) {
                toast("Gagal menghapus berita.", "error");
            }
        }

        function cancelNewsEdit() { state.editNewsData = null; render(); }

        function searchTable(q) {
            const rows = document.querySelectorAll('#data-table tbody tr');
            rows.forEach(r => { r.style.display = r.innerText.toLowerCase().includes(q.toLowerCase()) ? '' : 'none'; });
        }

        function exportExcel() {
            const dataToExport = state.user.role === 'master' ? state.registrations : state.registrations.filter(r => r.smk === state.user.name);
            if (!dataToExport.length) return toast("Data kosong.", "error");
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data_Pendaftar");
            XLSX.writeFile(wb, `PPDB_NABIRE_${new Date().getFullYear()}.xlsx`);
        }

        render(); // Panggil fungsi render agar tampilan muncul
